name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing
      - name: Behaviour evaluation
        run: python scripts/run_evaluation.py --check
      - name: Build container
        run: docker build -t northstar-agent:test .
